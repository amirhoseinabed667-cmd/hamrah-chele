<script>

let habits = JSON.parse(localStorage.getItem("habit_tracker_v2")) || [];

    

    
  
    

    

    

    

    

    

    

    
  
    

    

    

    

    

    

    

    
  
    

    

    

    
let currentHabit = null;
    

    

    

    

    

    

    

    
let currentChille = null;
    

    

    

    

    

    

    

    
let deleteIndex = null;
    

    

    

    

    

    

    

    
let menuIndex = null;
    

    

    

    

    

    

    

    
  
    

    

    

    

    

    

    

    
  
    

    

    

    

    

    

    

    
  
    

    

    

    

    

    

    

    
  
    

    

    

    
function save(){
    

    

    

    
  
    

    

    

    

    

    

    

    
  
    

    

    

    
localStorage.setItem(
    

    

    

    
  
    

    

    

    
"habit_tracker_v2",
    

    

    

    
  
    

    

    

    
JSON.stringify(habits)
    

    

    

    
  
    

    

    

    
);
    

    

    

    
  
    

    

    

    

    

    

    

    
  
    

    

    

    
}
    

    

    

    
  
    

    

    

    

    

    

    

    
  
    

    

    

    

    

    

    

    
  
    

    

    

    

    

    

    

    
  
    

    

    

    
// افزودن عادت
    

    

    

    
  
    

    

    

    

    

    

    

    
  
    

    

    

    
function addHabit(){
    

    

    

    
  
    

    

    

    

    

    

    

    
  
    

    

    

    
let name=document.getElementById("name").value.trim();
    

    

    

    
  
    

    

    

    

    

    

    

    
  
    

    

    

    
let final=document.getElementById("final").value.trim();
    

    

    

    
  
    

    

    

    

    

    

    

    
  
    

    

    

    

    

    

    

    
  
    

    

    

    
if(name==="") return;
    

    

    

    
  
    

    

    

    

    

    

    

    
  
    

    

    

    

    

    

    

    
  
    

    

    

    

    

    

    

    
  
    

    

    

    
let chilles=[];
    

    

    

    
  
    

    

    

    

    

    

    

    
  
    

    

    

    

    

    

    

    
  
    

    

    

    
for(let i=0;i<9;i++){
    

    

    

    
  
    

    

    

    

    

    

    

    
  
    

    

    

    
chilles.push({
    

    

    

    
date:"",
    

    

    

    
small:"",
    

    

    

    
score:"",
    

    

    

    
days:Array(40).fill(""),
    

    

    

    
times:Array(40).fill(0)
    

    

    

    
});
    

    

    

    

    

    
}
    

    

    

    

    

    

    

    
  
    

    

    

    

    

    

    

    
  
    

    

    

    

    

    

    

    
  
    

    

    

    
let colors=[
"#00eaff", // آبی نئونی
"#ff4d4d", // قرمز
"#7CFF6B", // سبز
"#b266ff", // بنفش
"#ffcc00", // زرد
"#ff7ad9", // صورتی

"#00ffaa", // سبز فیروزه‌ای
"#ff8c42", // نارنجی
"#4d79ff", // آبی تیره
"#e066ff", // ارغوانی
"#66ffcc", // سبز آبی
"#ff6680", // صورتی قرمز

"#00d4ff", // آبی روشن
"#aaff00", // سبز زرد
"#ff66cc", // صورتی روشن
"#9966ff", // بنفش روشن
"#ffd166", // طلایی
"#06d6a0", // سبز دریایی

"#118ab2", // آبی عمیق
"#ef476f", // صورتی قرمز
"#8338ec", // بنفش قوی
"#3a86ff"  // آبی
];
    

    
  
    

    

    

    

    

    

    

    
  
    

    

    

    
habits.push({
    

    

    

    
  
    

    

    

    
name:name,
    

    

    

    
  
    

    

    

    
final:final,
    

    

    

    
  
    

    

    

    
chilles:chilles,
    

    

    

    
  
    

    

    

    
color: colors[habits.length % colors.length]
    

    

    

    
  
    

    

    

    
});
    

    

    

    
  
    

    

    

    

    

    

    

    
  
    

    

    

    

    

    

    

    
  
    

    

    

    

    

    

    

    
  
    

    

    

    
save();
    

    

    

    
  
    

    

    

    

    

    

    

    
  
    

    

    

    
renderHome();
    

    

    

    
  
    

    

    

    

    

    

    

    
  
    

    

    

    

    

    

    

    
  
    

    

    

    

    

    

    

    
  
    

    

    

    
document.getElementById("name").value="";
    

    

    

    
  
    

    

    

    

    

    

    

    
  
    

    

    

    
document.getElementById("final").value="";
    

    

    

    
  
    

    

    

    

    

    

    

    
  
    

    

    

    
}
    

    

    

    
  
    

    

    

    

    

    

    

    
  
    

    

    

    

    

    

    

    
  
    

    

    

    

    

    

    

    
  
    

    

    

    

    

    

    

    
  
    

    

    

    
// نمایش صفحه اصلی
    

    

    

    
  
    

    

    

    

    

    

    

    
  
    

    

    

    
function showHome(){
    

    

    

    
  
    

    

    

    

    

    

    

    
  
    

    

    

    
document.getElementById("home").classList.remove("hidden");
    

    

    

    
  
    

    

    

    

    

    

    

    
  
    

    

    

    
document.getElementById("detail").classList.add("hidden");
    

    

    

    
  
    

    

    

    

    

    

    

    
  
    

    

    

    
currentHabit=null;
    

    

    

    
  
    

    

    

    

    

    

    

    
  
    

    

    

    
}
    

    

    

    
  
    

    

    

    

    

    

    

    
  
    

    

    

    

    

    

    

    
  
    

    

    

    

    

    

    

    
  
    

    

    

    
// باز کردن یک عادت
    

    

    

    
  
    

    

    

    

    

    

    

    
  
    

    

    

    
function openHabit(index){
    

    

    

    
  
    

    

    

    

    

    

    

    
  
    

    

    

    
currentHabit=index;
    

    

    

    
  
    

    

    

    

    

    

    

    
  
    

    

    

    
document.getElementById("home").classList.add("hidden");
    

    

    

    
  
    

    

    

    

    

    

    

    
  
    

    

    

    
document.getElementById("detail").classList.remove("hidden");
    

    

    

    
  
    

    

    

    

    

    

    

    
  
    

    

    

    
renderDetail();
    

    

    

    
  
    

    

    

    

    

    

    

    
  
    

    

    

    
}
    

    

    

    
  
    

    

    

    

    

    

    

    
  
    

    

    

    

    

    

    

    
  
    

    

    

    

    

    

    

    
  
    

    

    

    
// جستجو
    

    

    

    
  
    

    

    

    

    

    

    

    
  
    

    

    

    
function searchHabit(){
    

    

    

    
  
    

    

    

    

    

    

    

    
  
    

    

    

    
renderHome();
    

    

    

    
  
    

    

    

    

    

    

    

    
  
    

    

    

    
}
    

    

    

    
  
    

    

    

    

    

    

    

    
  
    

    

    

    

    

    

    

    
  
    

    

    

    

    

    

    

    
  
    

    

    

    
// حذف
    

    

    

    
  
    

    

    

    

    

    

    

    
  
    

    

    

    
function askDelete(i){
    

    

    

    

    

    

    

    
deleteIndex=i;
    

    

    

    

    

    

    

    
renderHome();
    

    

    

    

    

    

    

    
}
    

    

    

    

    

    

    

    
function toggleMenu(i){
    

    

    

    
if(menuIndex===i){
    

    

    

    
menuIndex=null;
    

    

    

    
}else{
    

    

    

    
menuIndex=i;
    

    

    

    
}
    

    

    

    
deleteIndex=null;
    

    

    

    
renderHome();
    

    

    

    
}
    

    

    

    
function editFinal(i){
    

    

    

    
let text = prompt(
    

    
"لقمه نهایی را ویرایش کنید",
    

    
habits[i].final
    

    
);
    

    

    

    
if(text!==null){
    

    

    

    
habits[i].final=text;
    

    

    

    
save();
    

    

    

    
}
    

    

    

    
menuIndex=null;
    

    

    

    
renderHome();
    

    

    

    
}
    

    

    

    

    

    

    

    
function confirmDelete(){
    

    

    

    

    

    

    

    
habits.splice(deleteIndex,1);
    

    

    

    

    

    

    

    
deleteIndex=null;
    

    

    

    

    

    

    

    
save();
    

    

    

    

    

    

    

    
renderHome();
    

    

    

    

    

    

    

    
}
    

    

    

    

    

    

    

    
function cancelDelete(){
    

    

    

    
  
    

    

    

    

    

    

    

    
  
    

    

    

    
deleteIndex=null;
    

    

    

    
  
    

    

    

    

    

    

    

    
  
    

    

    

    
renderHome();
    

    

    

    
  
    

    

    

    

    

    

    

    
  
    

    

    

    
}
    

    

    

    
  
    

    

    

    

    

    

    

    
  
    

    

    

    

    

    

    

    
  
    

    

    

    

    

    

    

    
  
    

    

    

    

    

    

    

    
  
    

    

    

    
// تغییر خانه
    

    

    

    
  
    

    

    

    

    

    

    

    
  
    

    

    

    
function changeDay(h,c,d){
    

    

    

    
let chille = habits[h].chilles[c];
    

    

    

    
if(!chille.times){
    

    

    

    
chille.times = Array(40).fill(0);
    

    

    

    
}
    

    

    

    
let now = Date.now();
    

    

    

    
if(
    

    
chille.times[d] !== 0 &&
    

    
now - chille.times[d] > 1 * 60 * 1000
    

    
){
    

    

    

    
alert("مهلت ویرایش این روز به پایان رسیده است.");
    

    

    

    
return;
    

    

    

    
}
    

    

    

    
let states = ["","✔️","❌","⛔"];
    

    

    

    
let old = chille.days[d];
    

    

    

    
let next = states[(states.indexOf(old)+1)%4];
    

    

    

    
chille.days[d] = next;
    

    

    

    
// اولین ثبت زمان
    

    
if(chille.times[d]===0 && next!==""){
    

    

    

    
chille.times[d]=now;
    

    

    

    
}
    

    

    

    
save();
    

    

    

    
renderDetail();
    

    

    

    
setTimeout(function(){
    

    
renderDetail();
    

    
},60000);
    
}
    

    

    
  
    

    

    

    

    

    

    

    
  
    

    

    

    

    

    

    

    
  
    

    

    

    

    

    

    

    
  
    

    

    

    
// باز کردن چله
    

    

    

    
  
    

    

    

    

    

    

    

    
  
    

    

    

    
function openChille(c){
    

    

    

    
  
    

    

    

    

    

    

    

    
  
    

    

    

    
currentChille=c;
    

    

    

    
  
    

    

    

    

    

    

    

    
  
    

    

    

    
renderDetail();

function exportData(){

    let data = JSON.stringify(habits, null, 2);

    let blob = new Blob([data], {
        type: "application/json"
    });

    let a = document.createElement("a");

    a.href = URL.createObjectURL(blob);

    let now = new Date();

let parts = new Intl.DateTimeFormat(
    "en-u-ca-persian",
    {
        year: "numeric",
        month: "2-digit",
        day: "2-digit"
    }
).formatToParts(now);

let year = parts.find(p => p.type === "year").value;
let month = parts.find(p => p.type === "month").value;
let day = parts.find(p => p.type === "day").value;

let date = year + "-" + month + "-" + day;

a.download = "Habit_Backup (" + date + ").json";

    a.click();
}


function importData(event){
