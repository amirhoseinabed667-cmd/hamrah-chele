for(let i=0;i<9;i++){
    

    

    

    
  
    

    

    

    

    

    

    

    
  
    

    

    

    
chilles.push({
    
date:"",
    
small:"",
    
score:"",
    
days:Array(40).fill(""),
    
times:Array(40).fill(0),
    
overdue:Array(40).fill(false)
    
});

}
    

    

    

    

    

    

    

    
  
    

    

    

    

    

    

    

    
  
    

    

    

    

    

    

    

    
  
    

    

    

    
let colors=[
"#00eaff", // آبی نئونی
"#ff4d4d", // قرمز
"#7CFF6B", // سبز
"#b266ff", // بنفش
"#ffcc00", // زرد
"#ff7ad9", // صورتی

"#00ffaa", // سبز فیروزه‌ای
"#ff8c42", // نارنجی
"#4d79ff", // آبی تیره
"#e066ff", // ارغوانی
"#66ffcc", // سبز آبی
"#ff6680", // صورتی قرمز

"#00d4ff", // آبی روشن
"#aaff00", // سبز زرد
"#ff66cc", // صورتی روشن
"#9966ff", // بنفش روشن
"#ffd166", // طلایی
"#06d6a0", // سبز دریایی

"#118ab2", // آبی عمیق
"#ef476f", // صورتی قرمز
"#8338ec", // بنفش قوی

];
    

    
  
    

    

    

    

    

    

    

    
  
    

    

    

    
habits.push({

// تغییر خانه
    

    

    

    
  
    

    

    

    

    

    

    

    
  
    

    

    

    
function changeDay(h,c,d){

let chille = habits[h].chilles[c];

if(!chille.times){

    chille.times = Array(40).fill(0);

}

if(!chille.overdue){

    chille.overdue = Array(40).fill(false);

}

let now = Date.now();


// پیدا کردن آخرین خانه ثبت‌شده
let lastDay = -1;

for(let x=0;x<40;x++){

    if(chille.days[x] !== ""){

        lastDay = x;

    }

}


// بررسی زمان باز شدن خانه بعدی
if(lastDay >= 0 && d > lastDay){

    // اگر خانه انتخاب‌شده قبلاً قرمز شده،
    // همچنان اجازه ثبت دارد
    if(
        chille.overdue &&
        chille.overdue[d] === true
    ){

        // اجازه ثبت داده می‌شود

    }else{

        let elapsed =
            now - chille.times[lastDay];

        // خانه بعدی فقط بعد از ۲۴ ساعت باز می‌شود
        if(
            d === lastDay + 1 &&
            elapsed < 24 * 60 * 60 * 1000
        ){

            alert(
                "هنوز ۲۴ ساعت از ثبت خانه قبلی نگذشته است."
            );

            return;

        }

        // خانه‌های بعد از خانه بعدی همیشه قفل هستند
        if(d > lastDay + 1){

            return;

        }

    }

}


// قفل یک دقیقه‌ای همان خانه
if(
    chille.times[d] !== 0 &&
    now - chille.times[d] > 60 * 1000
){

    return;

}

let states = ["","✔️","⛔","❌"];

let old = chille.days[d];

let next = states[(states.indexOf(old)+1)%4];

chille.days[d] = next;


// اولین ثبت زمان

if(chille.times[d]===0 && next!==""){

    chille.times[d]=now;

}

    

    

    
save();
    

    

    

    
renderDetail();
    

    

    

    
setTimeout(function(){
    

    
renderDetail();
    

    
},60000);

// نمایش یک عادت







  















  







function renderDetail(){

    let box = document.getElementById("detailBox");

    let h = habits[currentHabit];

    let html = `

<div class="card">

<button onclick="showHome()">
بازگشت
</button>

<h2>
${h.name}
</h2>

<div class="info">
لقمه نهایی:
${(h.final || "-").replace(/\s+/g, " ")}
</div>

<div class="chilles">
`;

    // نمایش ۹ چله
    for(let i=0;i<9;i++){

        html += `

<button class="chille"
onclick="openChille(${i})">

چله ${i+1}

</button>

`;

    }

    html += `

</div>

</div>

`;


    if(currentChille !== null){

        let c = h.chilles[currentChille];


        // ساخت آرایه overdue در صورت نبودن
        if(!c.overdue){

            c.overdue = Array(40).fill(false);

        }


        // ساخت آرایه times در صورت نبودن
        if(!c.times){

            c.times = Array(40).fill(0);

        }


        let ok = 0;
        let no = 0;
        let stop = 0;


        c.days.forEach(day => {

            if(day === "✔️") ok++;

            else if(day === "❌") no++;

            else if(day === "⛔") stop++;

        });


        html += `

<div class="card">

<label>
تاریخ شروع
</label>

<input
value="${c.date || ""}"
oninput="updateChille('date',this.value)">


<label>
لقمه کوچک
</label>

<textarea
oninput="updateChille('small',this.value)"
>${c.small || ""}</textarea>


<div class="days">
`;


        // پیدا کردن آخرین خانه ثبت‌شده
        let lastDay = -1;

        for(let x=0;x<40;x++){

            if(
                c.days[x] !== "" &&
                c.times[x] != 0
            ){

                lastDay = x;

            }

        }


        // بررسی گذشتن ۲۴ ساعت از آخرین ثبت
        let twentyFourHoursPassed = true;

        if(lastDay >= 0){

            twentyFourHoursPassed =
                Date.now() - c.times[lastDay] >=
                24 * 60 * 60 * 1000;

        }


        // خانه بعدی
        let nextDay = lastDay + 1;


        // بررسی اینکه مهلت خانه بعدی گذشته یا نه
        if(
            lastDay >= 0 &&
            nextDay < 40 &&
            c.days[nextDay] === ""
        ){

            let openTime =
                c.times[lastDay] +
                24 * 60 * 60 * 1000;

            let deadline =
                new Date(openTime);

            deadline.setHours(24,0,0,0);


            if(Date.now() >= deadline){

                c.overdue[nextDay] = true;

                save();

            }

        }


        // ساخت ۴۰ خانه
        for(let d=0;d<40;d++){

            let locked = "";
            let futureLocked = "";
            let overdue = "";


            // قفل یک دقیقه‌ای همان خانه
            if(
                c.times[d] != 0 &&
                Date.now() - c.times[d] > 60 * 1000
            ){

                locked = " locked";

            }


            // اگر خانه قبلاً قرمز شده باشد
            if(
                c.overdue[d] === true
            ){

                overdue = " overdue";

            }


            // قبل از گذشت ۲۴ ساعت
            // خانه‌های بعدی قفل باشند
            if(
                lastDay >= 0 &&
                !twentyFourHoursPassed &&
                d > lastDay
            ){

                futureLocked = " futureLocked";

            }


            // بعد از گذشت ۲۴ ساعت
            // فقط خانه بعدی باز باشد
            if(
                lastDay >= 0 &&
                twentyFourHoursPassed &&
                d > nextDay
            ){

                futureLocked = " futureLocked";

            }


            html += `

<div class="day${locked}${futureLocked}${overdue}"
onclick="changeDay(${currentHabit},${currentChille},${d})">

<span class="dayNumber">${d+1}</span>

<span>${c.days[d]}</span>

</div>

`;

        }


        html += `

</div>


<div class="confirm"

style="
display:flex;
justify-content:space-around;
align-items:center;
margin-top:15px;
padding:10px;
border:1px solid #6FCF97;
border-radius:15px;
background:#1D4637;
font-size:18px;
">

<span>✔️ ${ok}</span>

<span>❌ ${no}</span>

<span>⛔ ${stop}</span>

</div>


<label style="margin-top:15px;display:block;">

امتیاز پایان چله

</label>


<input
value="${c.score || ""}"
oninput="updateChille('score',this.value)">

</div>

`;

    }


    box.innerHTML = html;

}
renderHome();


function exportData(){

    let data = JSON.stringify(habits, null, 2);

    let blob = new Blob([data], {
        type: "application/json"
    });

    let a = document.createElement("a");

    a.href = URL.createObjectURL(blob);

    let now = new Date();

let parts = new Intl.DateTimeFormat(
    "en-u-ca-persian",
    {
        year: "numeric",
        month: "2-digit",
        day: "2-digit"
    }
).formatToParts(now);

let year = parts.find(p => p.type === "year").value;
let month = parts.find(p => p.type === "month").value;
let day = parts.find(p => p.type === "day").value;

let date = year + "-" + month + "-" + day;

a.download = "Habit_Backup (" + date + ").json";

    a.click();
}


function importData(event){

    let file = event.target.files[0];

    if(!file) return;

    let reader = new FileReader();

    reader.onload = function(e){

        if(!confirm("اطلاعات فعلی جایگزین شود؟")) return;

        habits = JSON.parse(e.target.result);

        save();

        renderHome();

        alert("بازیابی انجام شد");

    };

    reader.readAsText(file);

}

    }

let guideIndex = 0;


function showGuideStep() {

    const overlay = document.getElementById("guideOverlay");
    const stepNumber = document.getElementById("guideStep");
    const title = document.getElementById("guideTitle");
    const text = document.getElementById("guideText");

    if (!overlay || !stepNumber || !title || !text) {
        return;
    }

    const buttons = document.querySelectorAll(
        "#guideBox .guideButtons button"
    );

    const previousButton = buttons[0];
    const nextButton = buttons[1];

    const step = guideSteps[guideIndex];


    /* قرار دادن اطلاعات مرحله */

    stepNumber.textContent =
        "مرحله " + (guideIndex + 1) +
        " از " + guideSteps.length;

    title.textContent = step.title;

    text.textContent = step.text;


    /* دکمه قبلی */

    if (guideIndex === 0) {

        previousButton.style.visibility = "hidden";

    } else {

        previousButton.style.visibility = "visible";

    }


    /* دکمه بعدی / شروع استفاده */

    if (guideIndex === guideSteps.length - 1) {

        nextButton.textContent = "شروع استفاده";

    } else {

        nextButton.textContent = "بعدی";

    }


    /* نمایش راهنما بعد از قرار گرفتن متن */

    requestAnimationFrame(function () {

        overlay.style.display = "flex";

    });

}


function startGuide() {

    guideIndex = 0;

    showGuideStep();

}


function nextGuide() {

    if (guideIndex < guideSteps.length - 1) {

        guideIndex++;

        showGuideStep();

    } else {

        finishGuide();

    }

}


function previousGuide() {

    if (guideIndex > 0) {

        guideIndex--;

        showGuideStep();

    }

}


function skipGuide() {

    finishGuide();

}


function finishGuide() {

    const overlay =
        document.getElementById("guideOverlay");

    if (overlay) {

        overlay.style.display = "none";

    }

    localStorage.setItem(
        "guide_completed",
        "true"
    );

}
