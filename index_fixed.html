<script>
let habits = JSON.parse(localStorage.getItem("habit_tracker_v2")) || [];
function migrateHabits(){
    let changed = false;
    habits.forEach(habit => {
        // اگر قبلاً به ساختار دوره‌ای تبدیل شده،
        // دوباره تبدیل نکن
        if(Array.isArray(habit.years)){
            return;
        }
        // تبدیل چله‌های فعلی به دوره اول
        habit.years = [
            {
                number: 1,
                chilles: habit.chilles || []
            }
        ];
        // حذف ساختار قدیمی
        delete habit.chilles;
        changed = true;
    });
    return changed;
}
migrateHabits();
localStorage.setItem(
    "habit_tracker_v2",
    JSON.stringify(habits)
);
let currentHabit = null;
let currentYear = 0;
let currentChille = null;
let deleteIndex = null;
let menuIndex = null;
// دوره آرشیوی که در حال نمایش چله‌های آن هستیم
let archiveYear = null;
let archiveOpen = false;
// چله آرشیوی انتخاب‌شده
let archiveChille = null;
async function save(){
    // ذخیره روی گوشی
    localStorage.setItem(
        "habit_tracker_v2",
        JSON.stringify(habits)
    );
    try {
        const {
            data: { user },
            error: userError
        } = await supabaseClient.auth.getUser();
        if(userError || !user){
            console.log("کاربری وارد نشده است.");
            return;
        }
        const { error } = await supabaseClient
            .from("user_data")
            .upsert(
                {
                    user_id: user.id,
                    data: habits
                },
                {
                    onConflict: "user_id"
                }
            );
        if(error){
            console.log(
                "خطا در ذخیره آنلاین:",
                error
            );
        }
    } catch(error){
        console.log(
            "خطای غیرمنتظره در ذخیره:",
            error
        );
    }
}
// افزودن عادت
function addHabit(){
let name=document.getElementById("name").value.trim();
let final=document.getElementById("final").value.trim().replace(/\s+/g, " ");
if(name==="") return;
let chilles=[];
for(let i=0;i<9;i++){
chilles.push({
date:"",
small:"",
score:"",
days:Array(40).fill(""),
times:Array(40).fill(0),
overdue:Array(40).fill(false)
});
}
let colors=[
"#00eaff", // آبی نئونی
"#ff4d4d", // قرمز
"#7CFF6B", // سبز
"#b266ff", // بنفش
"#ffcc00", // زرد
"#ff7ad9", // صورتی
"#00ffaa", // سبز فیروزه‌ای
"#ff8c42", // نارنجی
"#4d79ff", // آبی تیره
"#e066ff", // ارغوانی
"#66ffcc", // سبز آبی
"#ff6680", // صورتی قرمز
"#00d4ff", // آبی روشن
"#aaff00", // سبز زرد
"#ff66cc", // صورتی روشن
"#9966ff", // بنفش روشن
"#ffd166", // طلایی
"#06d6a0", // سبز دریایی
"#118ab2", // آبی عمیق
"#ef476f", // صورتی قرمز
"#8338ec", // بنفش قوی
"#3a86ff"  // آبی
];
habits.push({
    name:name,
    final:final,
    years:[
        {
            number:1,
            chilles:chilles
        }
    ],
    color: colors[habits.length % colors.length]
});
save();
renderHome();
document.getElementById("name").value="";
document.getElementById("final").value="";
}
// نمایش صفحه اصلی
function showHome(){
document.getElementById("home").classList.remove("hidden");
document.getElementById("detail").classList.add("hidden");
currentHabit = null;
currentYear = 0;
currentChille = null;
archiveYear = null;
archiveChille = null;
}
// باز کردن یک عادت
function openHabit(index){
    currentHabit = index;
    // ورود به آخرین دوره موجود
    currentYear =
        habits[index].years.length - 1;
    currentChille = null;
archiveYear = null;
archiveChille = null;
archiveOpen = false;
    document.getElementById("home").classList.add("hidden");
    document.getElementById("detail").classList.remove("hidden");
    renderDetail();
}
// جستجو
function searchHabit(){
renderHome();
}
// حذف
function askDelete(i){
deleteIndex=i;
renderHome();
}
function toggleMenu(i){
if(menuIndex===i){
menuIndex=null;
}else{
menuIndex=i;
}
deleteIndex=null;
renderHome();
}
let editingFinalIndex = null;
function editFinal(i){
    editingFinalIndex = i;
    const overlay =
        document.getElementById("editFinalOverlay");
    const input =
        document.getElementById("editFinalInput");
    input.value = habits[i].final || "";
    overlay.style.display = "flex";
    setTimeout(function(){
        input.focus();
        input.setSelectionRange(
            input.value.length,
            input.value.length
        );
    },100);
}
function saveEditFinal(){
    if(editingFinalIndex === null){
        return;
    }
    const input =
        document.getElementById("editFinalInput");
    habits[editingFinalIndex].final =
        input.value.trim().replace(/\s+/g, " ");
    save();
    editingFinalIndex = null;
    document.getElementById(
        "editFinalOverlay"
    ).style.display = "none";
    menuIndex = null;
    renderHome();
}
function closeEditFinal(){
    editingFinalIndex = null;
    document.getElementById(
        "editFinalOverlay"
    ).style.display = "none";
}
function confirmDelete(){
habits.splice(deleteIndex,1);
deleteIndex=null;
save();
renderHome();
}
function cancelDelete(){
deleteIndex=null;
renderHome();
}
// تغییر خانه
function changeDay(h,c,d){
let chille = habits[h].years[currentYear].chilles[c];
// دوره‌های آرشیوی فقط قابل مشاهده هستند
if(currentYear < habits[h].years.length - 1){
    alert("این دوره در آرشیو قرار دارد و قابل ویرایش نیست.");
    return;
}
if(!chille.times){
    chille.times = Array(40).fill(0);
}
if(!chille.overdue){
    chille.overdue = Array(40).fill(false);
}
let now = Date.now();
// پیدا کردن آخرین خانه ثبت‌شده
let lastDay = -1;
for(let x=0;x<40;x++){
    if(chille.days[x] !== ""){
        lastDay = x;
    }
}
// بررسی زمان باز شدن خانه بعدی
if(lastDay >= 0 && d > lastDay){
    // اگر خانه انتخاب‌شده قبلاً قرمز شده،
    // همچنان اجازه ثبت دارد
    if(
        chille.overdue &&
        chille.overdue[d] === true
    ){
        // اجازه ثبت داده می‌شود
    }else{
        let elapsed =
            now - chille.times[lastDay];
        // خانه بعدی فقط بعد از ۲۴ ساعت باز می‌شود
        if(
            d === lastDay + 1 &&
            elapsed < 24 * 60 * 60 * 1000
        ){
            alert(
                "هنوز ۲۴ ساعت از ثبت خانه قبلی نگذشته است."
            );
            return;
        }
        // خانه‌های بعد از خانه بعدی همیشه قفل هستند
        if(d > lastDay + 1){
            return;
        }
    }
}
// قفل یک دقیقه‌ای همان خانه
if(
    chille.times[d] !== 0 &&
    now - chille.times[d] > 60 * 1000
){
    return;
}
let states = ["","✔️","⛔","❌"];
let old = chille.days[d];
let next = states[(states.indexOf(old)+1)%4];
chille.days[d] = next;
// اولین ثبت زمان
if(chille.times[d]===0 && next!==""){
    chille.times[d]=now;
}
save();
// بررسی کامل شدن دوره
if(
    next !== "" &&
    isYearComplete(
        habits[h],
        currentYear
    )
){
    createNewYear(h);
    currentYear =
        habits[h].years.length - 1;
    currentChille = null;
}
renderDetail();
setTimeout(function(){
    renderDetail();
},60000);
}
// باز کردن چله
function openChille(c){
    currentChille = c;
    // اگر از آرشیو چیزی انتخاب شده، آن را ببند
    archiveYear = null;
    archiveChille = null;
    renderDetail();
}
function openYear(y){
    // اگر همین دوره باز است، ببند
    if(archiveYear === y){
        archiveYear = null;
        archiveChille = null;
    }else{
        // باز کردن دوره آرشیوی
        archiveYear = y;
        archiveChille = null;
    }
    renderDetail();
}
function openArchiveChille(y, c){
    archiveYear = y;
    archiveChille = c;
    currentChille = null;
    renderDetail();
}
// تغییر اطلاعات چله
function updateChille(type,value){
    // دوره‌های آرشیوی قابل ویرایش نیستند
    if(
        currentYear <
        habits[currentHabit].years.length - 1
    ){
        return;
    }
    habits[currentHabit]
        .years[currentYear]
        .chilles[currentChille][type] = value;
    save();
}
function isYearComplete(habit, yearIndex){
    let year = habit.years[yearIndex];
    if(!year || !year.chilles){
        return false;
    }
    if(year.chilles.length < 9){
        return false;
    }
    for(let c=0; c<9; c++){
        let chille = year.chilles[c];
        if(!chille.days){
            return false;
        }
        for(let d=0; d<40; d++){
            if(chille.days[d] === ""){
                return false;
            }
        }
    }
    return true;
}
function createNewYear(habitIndex){
    let habit = habits[habitIndex];
    let lastYear =
        habit.years[habit.years.length - 1];
    if(!isYearComplete(
        habit,
        habit.years.length - 1
    )){
        return;
    }
    let newChilles = [];
    for(let i=0; i<9; i++){
        newChilles.push({
            date: "",
            small: "",
            score: "",
            days: Array(40).fill(""),
            times: Array(40).fill(0),
            overdue: Array(40).fill(false)
        });
    }
    habit.years.push({
        number: lastYear.number + 1,
        chilles: newChilles
    });
    save();
}
    function completeYearForTest(){
    if(currentHabit === null){
        return;
    }
    let habit = habits[currentHabit];
    let year = habit.years[currentYear];
    if(!year || !year.chilles){
        return;
    }
    if(currentYear !== habit.years.length - 1){
        alert("این دوره آرشیوی است.");
        return;
    }
    let now = Date.now();
    // تکمیل تمام ۹ چله و ۴۰ روز
    for(let c = 0; c < 9; c++){
        let chille = year.chilles[c];
        if(!chille.times){
            chille.times = Array(40).fill(0);
        }
        if(!chille.overdue){
            chille.overdue = Array(40).fill(false);
        }
        for(let d = 0; d < 40; d++){
            chille.days[d] = "✔️";
            chille.times[d] =
                now - ((40 - d) * 1000);
        }
    }
    save();
    alert(
        "دوره برای تست کامل شد. حالا دوره جدید ساخته می‌شود."
    );
    createNewYear(currentHabit);
    currentYear =
        habit.years.length - 1;
    currentChille = null;

    {
        year: "numeric",

    }
).formatToParts(now);

let day = parts.find(p => p.type === "day").value;
let date = year + "-" + month + "-" + day;
a.download = "Habit_Backup (" + date + ").json";

}

    }
];
let guideIndex = 0;
function showGuideStep() {
    const overlay = document.getElementById("guideOverlay");
    const stepNumber = document.getElementById("guideStep");
    const title = document.getElementById("guideTitle");
    const text = document.getElementById("guideText");
    if (!overlay || !stepNumber || !title || !text) {
        return;
    }
    const buttons = document.querySelectorAll(
        "#guideBox .guideButtons button"
    );
    const previousButton = buttons[0];
    const nextButton = buttons[1];
    const step = guideSteps[guideIndex];
    /* قرار دادن اطلاعات مرحله */
    stepNumber.textContent =
        "مرحله " + (guideIndex + 1) +
        " از " + guideSteps.length;
    title.textContent = step.title;
    text.textContent = step.text;
    /* دکمه قبلی */
    if (guideIndex === 0) {
        previousButton.style.visibility = "hidden";
    } else {
        previousButton.style.visibility = "visible";
    }
    /* دکمه بعدی / شروع استفاده */
    if (guideIndex === guideSteps.length - 1) {
        nextButton.textContent = "شروع استفاده";
    } else {
        nextButton.textContent = "بعدی";
    }
    /* نمایش راهنما بعد از قرار گرفتن متن */
    requestAnimationFrame(function () {
        overlay.style.display = "flex";
    });
}
function startGuide() {
    guideIndex = 0;
    showGuideStep();
}
function nextGuide() {
    if (guideIndex < guideSteps.length - 1) {
        guideIndex++;
        showGuideStep();
    } else {
        finishGuide();
    }
}
function previousGuide() {
    if (guideIndex > 0) {
        guideIndex--;
        showGuideStep();
    }
}
function skipGuide() {
    finishGuide();
}
function finishGuide() {
    const overlay =
        document.getElementById("guideOverlay");
    if (overlay) {
        overlay.style.display = "none";
    }
    localStorage.setItem(
        "guide_completed",
        "true"
    );
}
